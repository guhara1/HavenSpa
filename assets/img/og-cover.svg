<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="간다GO 경기북부 출장마사지 홈타이 지역 안내">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#141b27"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9838"/>
      <stop offset="1" stop-color="#f2620a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(90,150)">
    <rect x="0" y="0" width="86" height="86" rx="22" fill="url(#orange)"/>
    <text x="43" y="58" font-family="Pretendard, sans-serif" font-size="46" font-weight="900" fill="#fff" text-anchor="middle">G</text>
    <text x="112" y="60" font-family="Pretendard, sans-serif" font-size="52" font-weight="800" fill="#f6f8fb">간다GO</text>
  </g>
  <text x="90" y="360" font-family="Pretendard, sans-serif" font-size="72" font-weight="800" fill="#f6f8fb">경기북부 출장마사지</text>
  <text x="90" y="440" font-family="Pretendard, sans-serif" font-size="44" font-weight="700" fill="#ff9838">생활권별 방문 가능 지역 안내</text>
  <text x="90" y="520" font-family="Pretendard, sans-serif" font-size="30" font-weight="500" fill="#9aa7b8">일산 · 의정부 · 남양주 · 파주 · 양주 · 구리 · 포천 · 가평 · 연천</text>
</svg>
