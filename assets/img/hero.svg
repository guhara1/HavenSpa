<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" role="img" aria-label="경기북부 신도시 야경과 편안한 홈케어 분위기 이미지">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b0d"/>
      <stop offset="0.55" stop-color="#12100f"/>
      <stop offset="1" stop-color="#1a1310"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9838" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20242c"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9838"/>
      <stop offset="1" stop-color="#f2620a"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="760" height="720" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="760" height="720" fill="url(#sky)"/>
    <!-- warm horizon glow -->
    <ellipse cx="520" cy="470" rx="360" ry="150" fill="url(#glow)"/>
    <!-- moon / soft light -->
    <circle cx="600" cy="150" r="46" fill="#ffd9a8" opacity="0.9"/>
    <circle cx="600" cy="150" r="70" fill="#ffb060" opacity="0.12"/>

    <!-- distant skyline -->
    <g opacity="0.5">
      <rect x="40"  y="330" width="52" height="200" fill="#161a20"/>
      <rect x="110" y="290" width="40" height="240" fill="#181c23"/>
      <rect x="660" y="300" width="60" height="230" fill="#181c23"/>
      <rect x="710" y="340" width="40" height="190" fill="#161a20"/>
    </g>

    <!-- foreground apartment towers -->
    <g>
      <rect x="150" y="250" width="120" height="300" rx="6" fill="url(#bld)"/>
      <rect x="300" y="190" width="150" height="360" rx="6" fill="url(#bld)"/>
      <rect x="490" y="300" width="120" height="250" rx="6" fill="url(#bld)"/>
    </g>

    <!-- warm windows -->
    <g fill="#ffb968">
      <rect x="170" y="280" width="16" height="20" rx="2"/>
      <rect x="200" y="280" width="16" height="20" rx="2" opacity="0.6"/>
      <rect x="230" y="280" width="16" height="20" rx="2"/>
      <rect x="170" y="320" width="16" height="20" rx="2" opacity="0.5"/>
      <rect x="230" y="320" width="16" height="20" rx="2"/>
      <rect x="170" y="360" width="16" height="20" rx="2"/>
      <rect x="200" y="360" width="16" height="20" rx="2" opacity="0.7"/>
      <rect x="230" y="400" width="16" height="20" rx="2" opacity="0.6"/>
      <rect x="200" y="440" width="16" height="20" rx="2"/>

      <rect x="325" y="220" width="18" height="22" rx="2"/>
      <rect x="360" y="220" width="18" height="22" rx="2" opacity="0.6"/>
      <rect x="400" y="220" width="18" height="22" rx="2"/>
      <rect x="325" y="270" width="18" height="22" rx="2" opacity="0.5"/>
      <rect x="400" y="270" width="18" height="22" rx="2"/>
      <rect x="360" y="320" width="18" height="22" rx="2"/>
      <rect x="325" y="370" width="18" height="22" rx="2" opacity="0.7"/>
      <rect x="400" y="420" width="18" height="22" rx="2" opacity="0.6"/>
      <rect x="360" y="470" width="18" height="22" rx="2"/>

      <rect x="510" y="330" width="16" height="20" rx="2"/>
      <rect x="545" y="330" width="16" height="20" rx="2" opacity="0.6"/>
      <rect x="580" y="330" width="16" height="20" rx="2"/>
      <rect x="510" y="370" width="16" height="20" rx="2" opacity="0.5"/>
      <rect x="580" y="410" width="16" height="20" rx="2"/>
      <rect x="545" y="450" width="16" height="20" rx="2" opacity="0.7"/>
    </g>

    <!-- calm reflective ground -->
    <rect x="0" y="548" width="760" height="172" fill="#0b0c0e"/>
    <rect x="0" y="548" width="760" height="6" fill="#ff7a1a" opacity="0.25"/>

    <!-- relaxing aroma steam (line motif) -->
    <g stroke="url(#orange)" stroke-width="3" fill="none" opacity="0.8" stroke-linecap="round">
      <path d="M120 640 C 150 610, 90 585, 120 555 C 150 525, 95 500, 122 470"/>
      <path d="M175 650 C 205 620, 145 595, 175 565 C 205 535, 150 510, 177 480" opacity="0.55"/>
    </g>
    <!-- aroma cup -->
    <g transform="translate(96,636)">
      <rect x="0" y="0" width="90" height="46" rx="16" fill="#1a1c21" stroke="#ff8c2e" stroke-width="2"/>
      <path d="M90 10 h14 a14 14 0 0 1 0 28 h-14" fill="none" stroke="#ff8c2e" stroke-width="2"/>
    </g>

    <!-- badge -->
    <g transform="translate(40,40)">
      <rect x="0" y="0" width="188" height="44" rx="22" fill="#151619" stroke="#ff8c2e" stroke-opacity="0.5"/>
      <circle cx="26" cy="22" r="7" fill="url(#orange)"/>
      <text x="46" y="28" font-family="Pretendard, sans-serif" font-size="17" font-weight="700" fill="#ffce9a">경기북부 홈케어</text>
    </g>

    <!-- subtle border -->
    <rect x="1" y="1" width="758" height="718" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>
</svg>
